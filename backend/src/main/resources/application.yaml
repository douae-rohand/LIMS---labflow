spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  application:
    name: lims-backend

  # ============================================================
  # Datasource principal (schéma central)
  # ============================================================
  datasource:
    url: ${DB_CENTRAL_URL}
    username: ${DB_CENTRAL_USERNAME:root}
    password: ${DB_CENTRAL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: lims-central-pool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  # ============================================================
  # JPA / Hibernate
  # ============================================================
  jpa:
    hibernate:
      ddl-auto: none          # Flyway gère le schéma — ne pas laisser Hibernate l'altérer
    show-sql: false               # Passer à true en profil dev si besoin
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
        default_batch_fetch_size: 25

  # ============================================================
  # Flyway — migrations du schéma central uniquement
  # Le schéma tenant est migré programmatiquement lors du provisionnement
  # ============================================================
  flyway:
    enabled: true
    locations: classpath:db/migration/central
    baseline-on-migrate: true
    validate-on-migrate: true
    # Permet d'appliquer une version intercalée après un merge.
    out-of-order: true

  # L'envoi applicatif utilise l'API HTTP SendGrid v3 (voir sendgrid.*),
  # avec repli sur SMTP (voir app.mail.smtp.*).

  # ============================================================
  # Async (pour JournalAuditService, EmailService)
  # ============================================================
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 100

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 65MB

  # ============================================================
  # Spring AI — client OpenAI-compatible (Ollama, vLLM, OpenAI…)
  # ============================================================
  ai:
    openai:
      base-url: ${LLM_API_URL:http://localhost:11434/v1}
      api-key: ${LLM_API_KEY:no-key-required}
      chat:
        options:
          model: ${LLM_MODEL:llama3.2}
          temperature: 0.7

# ============================================================
# CORS
# ============================================================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ============================================================
# Serveur
# ============================================================
server:
  port: ${SERVER_PORT:8081}

  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain
  error:
    include-message: never      # Ne pas exposer les messages d'erreur en prod

# ============================================================
# JWT
# ============================================================
jwt:
  secret: ${JWT_SECRET:changeme-at-least-64-chars-base64-encoded-secret-for-HS512-algorithm}
  expiration: ${JWT_EXPIRATION:900000}          # 15 minutes en ms
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 jours en ms
  two-factor-expiration: ${JWT_TWO_FACTOR_EXPIRATION:900000}  # 15 minutes en ms (code e-mail)

# ============================================================
# MinIO
# ============================================================
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:lims-documents}

# ============================================================
# n8n
# ============================================================
n8n:
  webhook-base-url: ${N8N_WEBHOOK_BASE_URL:http://localhost:5678/webhook}

# ============================================================
# SendGrid — API v3 (e-mails transactionnels)
# ============================================================
sendgrid:
  enabled: ${SENDGRID_ENABLED:true}
  api-key: ${SENDGRID_API_KEY:${MAIL_PASSWORD:}}
  from-email: ${SENDGRID_FROM_EMAIL:no-reply@labflow.local}
  from-name: ${SENDGRID_FROM_NAME:LabFlow LIMS}
  api-base-url: ${SENDGRID_API_BASE_URL:https://api.sendgrid.com/v3}
  timeout-ms: ${SENDGRID_TIMEOUT_MS:8000}

# ============================================================
# Springdoc / Swagger UI
# ============================================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
  show-actuator: false

# ============================================================
# Actuator (health check)
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

# Seed de démonstration : provisionne les schémas tenant des laboratoires
# insérés par V21__seed_demo_central.sql (lims_atlas, lims_nord).
app:
  demo-seed: ${APP_DEMO_SEED:true}
  trust-proxy: ${APP_TRUST_PROXY:false}
  frontend-url: ${APP_FRONTEND_URL:${FRONTEND_URL:http://localhost:5173}}
  storage:
    path: ${APP_STORAGE_PATH:${user.home}/lims-documents}
  # SMTP de secours (ex. Gmail + mot de passe d'application), utilisé quand SendGrid
  # n'accepte pas un e-mail. Actif seulement si MAIL_MAILER=smtp et hôte/identifiants renseignés.
  mail:
    smtp:
      mailer: ${MAIL_MAILER:}
      host: ${MAIL_HOST:}
      port: ${MAIL_PORT:587}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      encryption: ${MAIL_ENCRYPTION:tls}
      from-address: ${MAIL_FROM_ADDRESS:}
      from-name: ${MAIL_FROM_NAME:${SENDGRID_FROM_NAME:LabFlow LIMS}}
  # Signature électronique des rapports (PAdES + horodatage RFC 3161)
  signature:
    # Mot de passe des coffres de certificats des laboratoires (PKCS#12). À définir en production.
    keystore-password: ${APP_SIGNATURE_KEYSTORE_PASSWORD:labflow-dev-keystore}
    tsa-enabled: ${APP_SIGNATURE_TSA_ENABLED:true}
    tsa-url: ${APP_SIGNATURE_TSA_URL:https://freetsa.org/tsr}
    tsa-timeout-ms: ${APP_SIGNATURE_TSA_TIMEOUT_MS:10000}
  integration:
    max-file-size-bytes: 10485760
    token-activation-hours: 48
  inscription:
    rate-limit:
      max-par-ip: ${APP_INSCRIPTION_MAX_PAR_IP:5}
      max-par-email: ${APP_INSCRIPTION_MAX_PAR_EMAIL:3}
      fenetre-secondes: ${APP_INSCRIPTION_FENETRE_SECONDES:3600}
    token-expiration-heures: ${APP_INSCRIPTION_TOKEN_EXPIRATION_HEURES:24}
    version-consentement-cndp: ${APP_INSCRIPTION_VERSION_CONSENTEMENT_CNDP:1.0}
  reinit-mot-de-passe:
    token-expiration-minutes: ${APP_REINIT_TOKEN_EXPIRATION_MINUTES:30}
    rate-limit:
      max-par-ip: ${APP_REINIT_MAX_PAR_IP:5}
      max-par-email: ${APP_REINIT_MAX_PAR_EMAIL:3}
      fenetre-secondes: ${APP_REINIT_FENETRE_SECONDES:3600}
      delai-cooldown-secondes: ${APP_REINIT_DELAI_COOLDOWN_SECONDES:60}

# ============================================================
# Espace Technicien (CMD-13)
# ============================================================
lims:
  technicien:
    # Plafond de durée déclarée par essai (en minutes). Défaut : 480 min = 8 h.
    duree-max-minutes: ${LIMS_TECHNICIEN_DUREE_MAX_MINUTES:480}
    import:
      # Taille maximale d'un fichier CSV d'import (en octets). Défaut : 1 Mo.
      taille-max-octets: ${LIMS_TECHNICIEN_IMPORT_TAILLE_MAX_OCTETS:1048576}
      # Nombre maximal de lignes de données dans le CSV. Défaut : 500.
      lignes-max: ${LIMS_TECHNICIEN_IMPORT_LIGNES_MAX:500}

# ============================================================
# Logging
# ============================================================
logging:
  level:
    root: INFO
    com.backend: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

---
# ============================================================
# Profil DEV — active avec : spring.profiles.active=dev
# ============================================================
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
  flyway:
    enabled: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
