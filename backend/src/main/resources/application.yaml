spring:
  config:
    import: optional:file:backend/.env[.properties]
  application:
    name: lims-backend

  # ============================================================
  # Datasource principal (schéma central)
  # ============================================================
  datasource:
    url: ${DB_CENTRAL_URL}
    username: ${DB_CENTRAL_USERNAME:root}
    password: ${DB_CENTRAL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: lims-central-pool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  # ============================================================
  # JPA / Hibernate
  # ============================================================
  jpa:
    hibernate:
      ddl-auto: none          # Flyway gère le schéma — ne pas laisser Hibernate l'altérer
    show-sql: false               # Passer à true en profil dev si besoin
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 25

  # ============================================================
  # Flyway — migrations du schéma central uniquement
  # Le schéma tenant est migré programmatiquement lors du provisionnement
  # ============================================================
  flyway:
    enabled: true
    locations: classpath:db/migration/central
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  # ============================================================
  # Email via SendGrid SMTP relay
  # ============================================================
  mail:
    host: ${MAIL_HOST:smtp.sendgrid.net}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:apikey}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # ============================================================
  # Async (pour JournalAuditService, EmailService)
  # ============================================================
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 100

  # ============================================================
  # Spring AI — client OpenAI-compatible (Ollama, vLLM, OpenAI…)
  # ============================================================
  ai:
    openai:
      base-url: ${LLM_API_URL:http://localhost:11434/v1}
      api-key: ${LLM_API_KEY:no-key-required}
      chat:
        options:
          model: ${LLM_MODEL:llama3.2}
          temperature: 0.7

# ============================================================
# CORS
# ============================================================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ============================================================
# Serveur
# ============================================================
server:
  port: ${SERVER_PORT}

  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain
  error:
    include-message: never      # Ne pas exposer les messages d'erreur en prod

# ============================================================
# JWT
# ============================================================
jwt:
  secret: ${JWT_SECRET:changeme-at-least-64-chars-base64-encoded-secret-for-HS512-algorithm}
  expiration: ${JWT_EXPIRATION:900000}          # 15 minutes en ms
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 jours en ms

# ============================================================
# MinIO
# ============================================================
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:lims-documents}

# ============================================================
# n8n
# ============================================================
n8n:
  webhook-base-url: ${N8N_WEBHOOK_BASE_URL:http://localhost:5678/webhook}

# ============================================================
# LLM (OpenAI-compatible)
# ============================================================
llm:
  api-url: ${LLM_API_URL:http://localhost:11434/v1}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:llama3.2}
  max-tokens: 2048
  temperature: 0.7

# ============================================================
# Springdoc / Swagger UI
# ============================================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
  show-actuator: false

# ============================================================
# Actuator (health check)
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

# ============================================================
# Logging
# ============================================================
logging:
  level:
    root: INFO
    com.backend: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

---
# ============================================================
# Profil DEV — active avec : spring.profiles.active=dev
# ============================================================
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
  flyway:
    enabled: false   # Désactiver Flyway en dev si la DB n'est pas encore provisionnée

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
